name: testes

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes
        run: python -X utf8 -m unittest discover -s _ferramentas
      - name: Validador das telas
        run: python -X utf8 _ferramentas/checar.py $(git ls-files '*.html')
